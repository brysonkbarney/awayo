name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Package app
        run: Scripts/package_app.sh
      - name: Package DMG
        run: Scripts/package_dmg.sh
      - name: Verify app signature
        run: codesign --verify --deep --strict dist/Awayo.app
